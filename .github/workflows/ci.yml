name: Android CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "perf/**", "fix/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests
        run: bash ./gradlew testDebugUnitTest

      - name: Run Android lint
        run: bash ./gradlew lintDebug

      - name: Assemble debug APK for CI validation
        run: bash ./gradlew assembleDebug

      - name: Upload CI APK
        uses: actions/upload-artifact@v4
        with:
          name: MuPlayer-ci-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
