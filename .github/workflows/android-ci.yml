name: Android CI

on:
  pull_request:
  push:
    branches:
      - main
      - "fix/ui-selection-and-touch-targets"

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests and build debug APK
        run: bash ./gradlew testDebugUnitTest assembleDebug
