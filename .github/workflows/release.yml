name: Publish MuPlayer release

on:
  push:
    branches:
      - main
    tags:
      - "V.6.0.0"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag to publish"
        required: true
        default: "V.6.0.0"
        type: string

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Check release version and avoid duplicate release
        id: release-check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ github.event.inputs.tag_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          VERSION=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts)
          if [[ "$VERSION" != "6.0.0" ]]; then
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            echo "This commit is not MuPlayer 6.0.0; skipping release."
            exit 0
          fi
          TAG_NAME="$REF_NAME"
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then TAG_NAME="$INPUT_TAG"; fi
          if [[ "$EVENT_NAME" == "push" && "$REF_NAME" == "main" ]]; then TAG_NAME="V.6.0.0"; fi
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            echo "Release $TAG_NAME already exists; skipping."
          else
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "tag_name=$TAG_NAME" >> "$GITHUB_OUTPUT"
            echo "tag_exists=false" >> "$GITHUB_OUTPUT"
            if [[ "$EVENT_NAME" == "push" && "$REF_NAME" == "V.6.0.0" ]]; then
              echo "tag_exists=true" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Set up JDK 17
        if: steps.release-check.outputs.should_release == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        if: steps.release-check.outputs.should_release == 'true'
        uses: gradle/actions/setup-gradle@v4

      - name: Run tests and build APK
        if: steps.release-check.outputs.should_release == 'true'
        run: bash ./gradlew testDebugUnitTest assembleDebug

      - name: Name release APK
        if: steps.release-check.outputs.should_release == 'true'
        run: cp app/build/outputs/apk/debug/app-debug.apk MuPlayer_V.6.0.0.apk

      - name: Publish GitHub release
        if: steps.release-check.outputs.should_release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ steps.release-check.outputs.tag_name }}
          TAG_EXISTS: ${{ steps.release-check.outputs.tag_exists }}
        run: |
          if [[ "$TAG_EXISTS" == "true" ]]; then
            gh release create "$TAG_NAME" MuPlayer_V.6.0.0.apk \
              --verify-tag \
              --title "MuPlayer $TAG_NAME" \
              --notes-file release_notes.md
          else
            gh release create "$TAG_NAME" MuPlayer_V.6.0.0.apk \
              --target "$GITHUB_SHA" \
              --title "MuPlayer $TAG_NAME" \
              --notes-file release_notes.md
          fi
