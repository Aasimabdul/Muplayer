name: Publish MuPlayer release

on:
  push:
    tags:
      - "V.6.0.0"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag to publish"
        required: true
        default: "V.6.0.0"
        type: string

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run tests and build APK
        run: bash ./gradlew testDebugUnitTest assembleDebug

      - name: Name release APK
        run: cp app/build/outputs/apk/debug/app-debug.apk MuPlayer_V.6.0.0.apk

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.event.inputs.tag_name || github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            gh release create "$TAG_NAME" MuPlayer_V.6.0.0.apk \
              --target "$GITHUB_SHA" \
              --title "MuPlayer $TAG_NAME" \
              --notes-file release_notes.md
          else
            gh release create "$TAG_NAME" MuPlayer_V.6.0.0.apk \
              --verify-tag \
              --title "MuPlayer $TAG_NAME" \
              --notes-file release_notes.md
          fi
