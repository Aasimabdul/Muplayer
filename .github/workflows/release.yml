name: Publish MuPlayer release

on:
  push:
    tags:
      - "V.6.0.0"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run tests and build APK
        run: bash ./gradlew testDebugUnitTest assembleDebug

      - name: Name release APK
        run: cp app/build/outputs/apk/debug/app-debug.apk MuPlayer_V.6.0.0.apk

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" MuPlayer_V.6.0.0.apk \
            --verify-tag \
            --title "MuPlayer V.6.0.0" \
            --notes-file release_notes.md
