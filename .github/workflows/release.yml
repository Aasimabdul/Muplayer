name: Publish MuPlayer production release

on:
  push:
    tags:
      - "V.*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Existing MuPlayer release tag to build and publish"
        required: true
        default: "V.6.2.0"
        type: string

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Select release tag
        id: release
        env:
          INPUT_TAG: ${{ inputs.tag_name }}
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            TAG_NAME="$INPUT_TAG"
          else
            TAG_NAME="$REF_NAME"
          fi
          if [[ ! "$TAG_NAME" =~ ^V\.[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Unsupported release tag: $TAG_NAME"
            exit 1
          fi
          echo "tag_name=$TAG_NAME" >> "$GITHUB_OUTPUT"

      - name: Check out the tagged source
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ steps.release.outputs.tag_name }}

      - name: Validate version and signing secrets
        env:
          TAG_NAME: ${{ steps.release.outputs.tag_name }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts)
          if [[ "$TAG_NAME" != "V.$VERSION" ]]; then
            echo "Tag $TAG_NAME does not match app version $VERSION"
            exit 1
          fi
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "Missing required repository secret: $name"
              echo "Refusing to publish an unsigned or debug APK."
              exit 1
            fi
          done
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            echo "A release already exists for $TAG_NAME; refusing to overwrite it."
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/muplayer-release.jks"
          test -s "$RUNNER_TEMP/muplayer-release.jks"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests and lint
        run: |
          ./gradlew testDebugUnitTest
          ./gradlew lintRelease

      - name: Build signed production APK
        env:
          ORG_GRADLE_PROJECT_RELEASE_STORE_FILE: ${{ runner.temp }}/muplayer-release.jks
          ORG_GRADLE_PROJECT_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ORG_GRADLE_PROJECT_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ORG_GRADLE_PROJECT_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Verify APK signature and package
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          cp "$APK" "MuPlayer_${{ steps.release.outputs.tag_name }}.apk"
          sha256sum "MuPlayer_${{ steps.release.outputs.tag_name }}.apk" > SHA256SUMS.txt

      - name: Publish verified production release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ steps.release.outputs.tag_name }}
        run: |
          gh release create "$TAG_NAME" "MuPlayer_$TAG_NAME.apk" SHA256SUMS.txt \
            --verify-tag \
            --title "MuPlayer $TAG_NAME" \
            --notes-file release_notes.md
